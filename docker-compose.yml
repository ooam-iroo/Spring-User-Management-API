services:
  postgres:
    image: postgres:16
    container_name: user-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: user_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - user-management-postgres-data:/var/lib/postgresql/data

    networks:
      - user-management-network

volumes:
  user-management-postgres-data:

networks:
  user-management-network:
    driver: bridge